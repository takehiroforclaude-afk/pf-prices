name: fetch-prices
on:
  schedule:
    - cron: '15 21 * * 1-5'
    - cron: '45 21 * * 1-5'
    - cron: '15 22 * * 1-5'
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet yfinance pandas
      - run: mkdir -p data && python fetch_prices.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "prices $(date -u +%F_%H%M)"
          git push
